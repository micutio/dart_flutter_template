# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart & Flutter

on:
  push:
    branches: ["main", "feature/**", "bugfix/**"]
  pull_request:
    branches: ["main", "feature/**", "bugfix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: dart analyze --fatal-infos

  fix:
    name: Fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # dart fix --dry-run exits 0 even when fixes are available.
      - name: Check automated fixes
        shell: bash
        run: |
          output="$(dart fix --dry-run)"
          echo "$output"
          if ! grep -q "Nothing to fix!" <<< "$output"; then
            echo "::error::Automated Dart fixes are available. Run 'dart fix --apply'."
            exit 1
          fi

  test:
    name: Test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Core & CLI tests
        run: |
          dart test packages/core
          dart test packages/cli

      - name: Run Flutter App tests
        run: flutter test packages/app

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: |
          dart test --coverage=packages/core/coverage packages/core
          dart run coverage:format_coverage --lcov --in=packages/core/coverage --out=packages/core/coverage/lcov.info --report-on=packages/core/lib --base-directory=.
          flutter test --coverage packages/app

      - name: Upload Core coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-coverage-lcov
          path: packages/core/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload App coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-coverage-lcov
          path: packages/app/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  build-cli:
    name: Build CLI
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build CLI bundle
        shell: bash
        run: |
          cd packages/cli
          dart build cli

      - name: Smoke test CLI bundle
        shell: bash
        run: |
          cd packages/cli
          dart run tool/smoke_cli.dart

      - name: Upload CLI bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.os }}
          path: packages/cli/build/cli/
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Build Android
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@862e3223030d4a79c9484b80a4e320d36181b5fb # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@f2c4f66bb15b2571a24d5b94f06861ad322957a7 # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        shell: bash
        run: |
          cd packages/app
          flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: packages/app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
